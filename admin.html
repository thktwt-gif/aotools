<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanPack Pro Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell admin-page">
      <header class="admin-header">
        <h1>后台管理台</h1>
        <div class="admin-actions">
          <a class="btn btn-outline" href="index.html" target="_blank">预览前台</a>
          <button id="saveAllBtn" class="btn btn-primary" type="button">保存全部</button>
        </div>
      </header>

      <section class="panel">
        <h2>页面拖拽布局（前台可视化区块）</h2>
        <p class="section-sub">拖拽区块排序，支持 Hero / Features / CTA，保存后前台自动生效。</p>
        <div class="layout-toolbar">
          <button class="btn btn-outline" type="button" data-add-block="hero">+ Hero</button>
          <button class="btn btn-outline" type="button" data-add-block="features">+ Features</button>
          <button class="btn btn-outline" type="button" data-add-block="cta">+ CTA</button>
        </div>
        <div id="layoutList" class="admin-list dropzone"></div>
      </section>

      <section class="panel two-col">
        <div>
          <h2>产品管理</h2>
          <form id="productForm" class="admin-form">
            <input type="text" name="name" placeholder="产品名称" required />
            <input type="text" name="category" placeholder="分类" required />
            <textarea name="summary" rows="3" placeholder="简介" required></textarea>
            <button class="btn btn-primary" type="submit">添加产品</button>
          </form>
          <div id="productList" class="admin-list"></div>
        </div>

        <div>
          <h2>文章管理</h2>
          <form id="articleForm" class="admin-form">
            <input type="text" name="title" placeholder="文章标题" required />
            <select name="status">
              <option value="draft">草稿</option>
              <option value="published">已发布</option>
            </select>
            <textarea name="excerpt" rows="3" placeholder="摘要" required></textarea>
            <button class="btn btn-primary" type="submit">添加文章</button>
          </form>
          <div id="articleList" class="admin-list"></div>
        </div>
      </section>

      <p id="adminStatus" class="section-sub"></p>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
